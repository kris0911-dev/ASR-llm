plugins { id 'com.android.application' }

android {
    namespace 'com.asrllm'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.asrllm'
        minSdk 21          // Android 5.0 Lollipop and newer
        targetSdk 35
        versionCode 1
        versionName '1.0'
        ndk {
            // 64-bit only: a ~1 GB model does not fit in a 32-bit process.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // demo only
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    packagingOptions {
        // keep .so files as real files so ggml can find the CPU variants in nativeLibraryDir
        jniLibs { useLegacyPackaging true }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
}
